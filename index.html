<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leaf Classifier — live camera</title>
<style>
  :root {
    --bg: #10151b;
    --card: #1a222c;
    --text: #e8edf2;
    --muted: #93a1b1;
    --accent: #4cc38a;
    --bar-bg: #2a3542;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 12px calc(24px + env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 520px; }
  h1 { font-size: 1.15rem; margin: 6px 2px 10px; }
  .videowrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
  }
  video, .cammsg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .cammsg {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    padding: 20px;
    font-size: 0.95rem;
  }
  .topbadge {
    position: absolute;
    left: 8px;
    bottom: 8px;
    background: rgba(0,0,0,0.65);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 1rem;
    font-weight: 600;
  }
  .controls { display: flex; gap: 8px; margin: 12px 0 4px; flex-wrap: wrap; }
  button, .filebtn {
    flex: 1 1 auto;
    background: var(--card);
    color: var(--text);
    border: 1px solid #33404f;
    border-radius: 10px;
    padding: 12px;
    font-size: 1rem;
    cursor: pointer;
    text-align: center;
  }
  button:active, .filebtn:active { background: #232e3a; }
  input[type="file"] { display: none; }
  #status { color: var(--muted); font-size: 0.85rem; margin: 6px 2px; min-height: 1.2em; }
  .probs { background: var(--card); border-radius: 12px; padding: 12px; margin-top: 8px; }
  .row { margin: 10px 0; }
  .row .lbl {
    display: flex;
    justify-content: space-between;
    font-size: 0.95rem;
    margin-bottom: 4px;
  }
  .row .pct { font-variant-numeric: tabular-nums; color: var(--muted); }
  .row.top .lbl, .row.top .pct { color: var(--text); font-weight: 700; }
  .track { background: var(--bar-bg); border-radius: 4px; height: 10px; overflow: hidden; }
  .fill { background: var(--accent); height: 100%; width: 0%; border-radius: 4px; transition: width 150ms linear; }
  footer {
    width: 100%;
    max-width: 520px;
    margin-top: 28px;
    border-top: 1px solid #2a3542;
    padding-top: 16px;
  }
  #qrcard { display: flex; gap: 16px; align-items: center; }
  #qrcard .qrbox { background: #fff; padding: 8px; border-radius: 8px; width: 148px; height: 148px; flex: 0 0 auto; }
  #qrcard .qrbox.pending {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #55606b;
    font-size: 0.75rem;
    line-height: 1.3;
  }
  #qrcard svg { display: block; width: 100%; height: 100%; }
  #qrcard .qrtext { font-size: 0.9rem; color: var(--muted); }
  #qrcard .qrtext strong { color: var(--text); display: block; margin-bottom: 6px; font-size: 1rem; }
  #qrcard a { color: var(--accent); word-break: break-all; }
  #preview { display: none; }
</style>
</head>
<body>
<main>
  <h1>🍃 Leaf Classifier (live camera)</h1>

  <div class="videowrap">
    <video id="video" playsinline autoplay muted></video>
    <div class="cammsg" id="cammsg">Press “Start camera”, or choose a photo below.</div>
    <div class="topbadge" id="topbadge" style="display:none"></div>
  </div>

  <div class="controls">
    <button id="camBtn" type="button">Start camera</button>
    <label class="filebtn" for="fileInput">Choose photo</label>
    <input type="file" id="fileInput" accept="image/*">
  </div>
  <div id="status"></div>

  <div class="probs" id="probs" aria-live="polite"></div>
</main>

<footer>
  <div id="qrcard">
    <div class="qrbox" id="qrbox" aria-hidden="true"></div>
    <div class="qrtext">
      <strong>Scan to open this page on your phone</strong>
      <a id="applink" href="https://evangeloskarlis.github.io/mlr-ex08/" target="_blank" rel="noopener">https://evangeloskarlis.github.io/mlr-ex08/</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/ort.wasm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
"use strict";

// ---- Model description (from model_info.json) ----
const APP_URL = "https://evangeloskarlis.github.io/mlr-ex08/";
const MODEL_URL = "./leaf_model.onnx";
const CLASSES = ["apple", "cherry", "chestnut", "maple"];
const INPUT_SIZE = 96;
const MEAN = [0.485, 0.456, 0.406];
const STD = [0.229, 0.224, 0.225];

// ---- Elements ----
const video = document.getElementById("video");
const cammsg = document.getElementById("cammsg");
const camBtn = document.getElementById("camBtn");
const fileInput = document.getElementById("fileInput");
const statusEl = document.getElementById("status");
const probsEl = document.getElementById("probs");
const topbadge = document.getElementById("topbadge");

// Build probability rows once.
const rowEls = {};
for (const cls of CLASSES) {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML =
    '<div class="lbl"><span>' + cls + '</span><span class="pct">–</span></div>' +
    '<div class="track"><div class="fill"></div></div>';
  probsEl.appendChild(row);
  rowEls[cls] = { row, pct: row.querySelector(".pct"), fill: row.querySelector(".fill") };
}

function setStatus(msg) { statusEl.textContent = msg || ""; }

if (location.protocol === "file:") {
  setStatus("Opened directly from disk: browsers block loading the model " +
    "file this way. Open the deployed page URL, or serve this folder with a " +
    "local web server (e.g. python -m http.server).");
}

// ---- ONNX Runtime setup ----
// Single-threaded wasm: no cross-origin isolation is available on GitHub
// Pages, and iOS Safari is most reliable without pthreads.
ort.env.wasm.numThreads = 1;
ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/";
let session = null;
let inputName = null;
const sessionReady = ort.InferenceSession.create(MODEL_URL, {
  executionProviders: ["wasm"],
  graphOptimizationLevel: "all",
}).then(s => {
  session = s;
  inputName = s.inputNames[0];
  setStatus("");
  return s;
}).catch(err => {
  setStatus("Failed to load model: " + err);
  throw err;
});

// ---- Preprocessing ----
// Central square crop of the source, resized to INPUT_SIZE, RGB scaled to
// 0–1, standardized per channel, packed CHW as [1, 3, size, size].
const cv = document.createElement("canvas");
cv.width = cv.height = INPUT_SIZE;
const ctx = cv.getContext("2d", { willReadFrequently: true });
const tensorData = new Float32Array(3 * INPUT_SIZE * INPUT_SIZE);

function sourceToTensor(source, srcW, srcH) {
  const side = Math.min(srcW, srcH);
  const sx = (srcW - side) / 2;
  const sy = (srcH - side) / 2;
  ctx.drawImage(source, sx, sy, side, side, 0, 0, INPUT_SIZE, INPUT_SIZE);
  const px = ctx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE).data; // RGBA
  const plane = INPUT_SIZE * INPUT_SIZE;
  for (let i = 0; i < plane; i++) {
    tensorData[i] = (px[i * 4] / 255 - MEAN[0]) / STD[0];
    tensorData[plane + i] = (px[i * 4 + 1] / 255 - MEAN[1]) / STD[1];
    tensorData[2 * plane + i] = (px[i * 4 + 2] / 255 - MEAN[2]) / STD[2];
  }
  return new ort.Tensor("float32", tensorData, [1, 3, INPUT_SIZE, INPUT_SIZE]);
}

// ---- Inference & display ----
let busy = false;

async function runOnce(source, srcW, srcH) {
  if (busy || !session) return;
  busy = true;
  try {
    const tensor = sourceToTensor(source, srcW, srcH);
    const results = await session.run({ [inputName]: tensor });
    const out = results[session.outputNames[0]];
    let p = Array.from(out.data);
    // Only softmax if the model does not already output probabilities.
    const sum = p.reduce((a, b) => a + b, 0);
    if (p.some(v => v < 0) || sum < 0.95 || sum > 1.05) {
      const m = Math.max(...p);
      const e = p.map(v => Math.exp(v - m));
      const s = e.reduce((a, b) => a + b, 0);
      p = e.map(v => v / s);
    }
    showProbs(p);
  } catch (err) {
    setStatus("Inference error: " + err);
  } finally {
    busy = false;
  }
}

function showProbs(p) {
  window.lastProbs = p;          // test hooks used by the dev checks against
  window.lastProbsAt = Date.now(); // check_expected.json and the loop test
  let topCls = CLASSES[0];
  for (let i = 0; i < CLASSES.length; i++) {
    const cls = CLASSES[i];
    if (p[i] > p[CLASSES.indexOf(topCls)]) topCls = cls;
    rowEls[cls].pct.textContent = (p[i] * 100).toFixed(1) + "%";
    rowEls[cls].fill.style.width = (p[i] * 100).toFixed(1) + "%";
    rowEls[cls].row.classList.toggle("top", false);
  }
  rowEls[topCls].row.classList.add("top");
  topbadge.textContent = topCls + " · " + (p[CLASSES.indexOf(topCls)] * 100).toFixed(1) + "%";
  topbadge.style.display = "";
}

// ---- Live camera ----
let stream = null;
let running = false;
let rafId = 0;

async function startCamera(preferredStream) {
  setStatus("Starting camera…");
  try {
    stream = preferredStream || await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 1280 },
      },
    });
  } catch (err) {
    setStatus("Camera unavailable (" + err.name + "): " + err.message +
      " — you can still classify an uploaded photo.");
    return false;
  }
  video.srcObject = stream;
  video.setAttribute("playsinline", "");
  try { await video.play(); } catch (e) { /* autoplay policy */ }
  cammsg.style.display = "none";
  running = true;
  camBtn.textContent = "Stop camera";
  setStatus("Classifying…");
  const loop = () => {
    if (!running) return;
    if (session && video.readyState >= video.HAVE_CURRENT_DATA) {
      runOnce(video, video.videoWidth, video.videoHeight);
    }
    rafId = requestAnimationFrame(loop);
  };
  loop();
  return true;
}

function stopCamera() {
  running = false;
  cancelAnimationFrame(rafId);
  if (stream) {
    for (const t of stream.getTracks()) t.stop();
    stream = null;
  }
  video.srcObject = null;
  cammsg.style.display = "";
  cammsg.textContent = "Camera stopped. Press “Start camera”, or choose a photo.";
  camBtn.textContent = "Start camera";
  setStatus("");
}

camBtn.addEventListener("click", () => {
  if (running) stopCamera();
  else sessionReady.then(() => startCamera()).catch(() => {});
});
// Test hook: start the live loop with an injected MediaStream.
window.__startCamera = (s) => sessionReady.then(() => startCamera(s));

// ---- Photo upload fallback ----
fileInput.addEventListener("change", () => {
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = async () => {
    setStatus("Photo loaded — classifying.");
    if (running) stopCamera();
    cammsg.style.display = "none";
    // Show the picked photo in place of the camera feed.
    const imgEl = document.createElement("img");
    imgEl.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:cover;";
    imgEl.src = url;
    const old = cammsg.parentNode.querySelector("img");
    if (old) old.remove();
    cammsg.parentNode.insertBefore(imgEl, cammsg);
    await sessionReady.catch(() => {});
    while (busy) await new Promise(r => setTimeout(r, 30)); // let an in-flight run finish
    await runOnce(img, img.naturalWidth, img.naturalHeight);
  };
  img.onerror = () => setStatus("Could not decode that image.");
  img.src = url;
  fileInput.value = "";
});

// ---- QR code (generated in the browser, no external QR service) ----
// The QR must encode the page's real public URL. That is the baked-in
// APP_URL once deployment filled it in; while it is still a placeholder,
// fall back to the URL the page is actually served from (http/https only),
// so the QR always matches the live page it is displayed on.
function finalAppUrl() {
  if (APP_URL.indexOf("__") === -1) return APP_URL;
  if (/^https?:$/.test(location.protocol)) {
    return location.origin + location.pathname.replace(/index\.html$/, "");
  }
  return null;
}

(function renderQR() {
  const url = finalAppUrl();
  const box = document.getElementById("qrbox");
  const link = document.getElementById("applink");
  if (!url) {
    box.classList.add("pending");
    box.textContent = "QR code appears once the page is deployed";
    return;
  }
  link.href = url;
  link.textContent = url;
  const qr = qrcode(0, "M"); // version auto-detect, error correction level M
  qr.addData(url);
  qr.make();
  box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
})();

// Kick things off: try the camera immediately (works if the page is
// already unlocked; otherwise the Start button provides the gesture).
sessionReady.then(() => {
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    // Do not auto-start on iOS without a gesture; just report readiness.
    setStatus("Model ready. Press “Start camera”.");
  } else {
    setStatus("Model ready. Camera API unavailable — use photo upload.");
  }
}).catch(() => {});
</script>
</body>
</html>
